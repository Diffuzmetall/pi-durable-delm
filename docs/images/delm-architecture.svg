<text x="1125" y="853" text-anchor="middle" class="caption" style="fill:#4A148C;font-weight:bold">событие: все нужные DONE</text>

<path class="flow" d="M360 802V883"/>
<text x="387" y="852" class="caption" style="fill:#00796B">Оба агента читают и пишут</text>
<rect class="card" x="60" y="905" width="1480" height="100" rx="18"/>
<text x="800" y="946" text-anchor="middle" class="label">ОБЩИЙ ПРОЕКТ</text>
<text x="800" y="981" text-anchor="middle" class="body">Одна рабочая папка · исходники · проверенный результат</text>
<rect x="60" y="1030" width="1480" height="45" rx="12" fill="#FFFFFF"/>
<text x="800" y="1061" text-anchor="middle" style="font-size:24px;font-weight:bold;fill:#4A148C">УВЕДОМЛЕНИЕ → SNAPSHOT → ЧТЕНИЕ → ACK</text>
<text x="800" y="1106" text-anchor="middle" class="small">Native API 1 обязателен · без отдельного runtime · без модельного polling</text>
</svg>
