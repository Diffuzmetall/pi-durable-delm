<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">Как работает DeLM для Pi Durable</title>
<desc id="desc">Пользователь утверждает запрос и план. Скилл и launcher готовят отдельные сессии существующего Native. Агенты работают в одном проекте и публикуют результаты через actor CLI на общей Python-доске. После всех требуемых DONE расширение delm_wait возобновляет нужную сессию. Участник читает сохранённый snapshot и явно подтверждает ACK. Native, модели, авторизация и guards остаются у пользователя; нужен Native API 1.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#00796B"/></marker>
 <marker id="purple-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="#4A148C"/></marker>
 <style>
  text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#202222} .heading{font-family:Georgia,'DejaVu Serif',serif;font-style:italic;font-size:62px;font-weight:bold} .label{font-size:26px;font-weight:700;letter-spacing:1px}.body{font-size:22px}.small{font-size:20px}.caption{font-size:21px;font-style:italic}.card{fill:white;stroke:#252728;stroke-width:3}.flow{fill:none;stroke:#00796B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.wake{fill:none;stroke:#4A148C;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#purple-arrow)}
 </style>
</defs>
